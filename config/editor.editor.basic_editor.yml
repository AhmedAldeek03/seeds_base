langcode: en
status: true
dependencies:
  config:
    - filter.format.basic_editor
  module:
    - ckeditor5
format: basic_editor
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - style
      - '|'
      - bold
      - italic
      - underline
      - strikethrough
      - superscript
      - subscript
      - '|'
      - alignment
      - direction
      - '|'
      - bulletedList
      - numberedList
      - indent
      - outdent
      - '|'
      - link
      - '|'
      - drupalMedia
      - '|'
      - insertTable
      - blockQuote
      - codeBlock
      - '|'
      - removeFormat
      - '|'
      - undo
      - redo
      - '|'
      - sourceEditing
      - '|'
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - left
        - right
    ckeditor5_codeBlock:
      languages:
        -
          label: 'Plain text'
          language: plaintext
        -
          label: C
          language: c
        -
          label: 'C#'
          language: cs
        -
          label: C++
          language: cpp
        -
          label: CSS
          language: css
        -
          label: Diff
          language: diff
        -
          label: HTML
          language: html
        -
          label: Java
          language: java
        -
          label: JavaScript
          language: javascript
        -
          label: PHP
          language: php
        -
          label: Python
          language: python
        -
          label: Ruby
          language: ruby
        -
          label: TypeScript
          language: typescript
        -
          label: XML
          language: xml
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<cite>'
        - '<dl>'
        - '<dt>'
        - '<dd>'
        - '<blockquote cite>'
        - '<h2 id>'
        - '<h3 id>'
        - '<h4 id>'
        - '<h5 id>'
        - '<h6 id>'
        - '<a hreflang>'
    ckeditor5_style:
      styles:
        -
          label: 'Primary Link'
          element: '<a class="btn btn-outline-primary">'
        -
          label: 'Secondary Link'
          element: '<a class="btn btn-outline-secondary">'
        -
          label: 'Light Link'
          element: '<a class="btn btn-outline-light">'
        -
          label: 'Dark Link'
          element: '<a class="btn btn-outline-dark">'
        -
          label: 'Primary Button'
          element: '<a class="btn btn-primary">'
        -
          label: 'Secondary Button'
          element: '<a class="btn btn-secondary">'
        -
          label: 'Light Button'
          element: '<a class="btn btn-light">'
        -
          label: 'Dark Button'
          element: '<a class="btn btn-dark">'
        -
          label: 'Primary Paragraph'
          element: '<p class="alert alert-primary">'
        -
          label: 'Secondary Paragraph'
          element: '<p class="alert alert-secondary">'
        -
          label: 'Dark Paragraph'
          element: '<p class="alert alert-dark">'
        -
          label: 'Light Paragraph'
          element: '<p class="alert alert-light">'
        -
          label: 'Light Header Table'
          element: '<table class="table thead-light">'
        -
          label: 'Dark Header Table'
          element: '<table class="table thead-dark">'
    ckeditor_media_resize_mediaResize:
      apply_image_styles: true
      image_styles:
        - cke_media_resize_small
        - cke_media_resize_medium
        - cke_media_resize_large
        - cke_media_resize_xl
    editor_advanced_link_link:
      enabled_attributes:
        - aria-label
        - class
        - id
        - rel
        - target
        - title
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
    media_media:
      allow_view_mode_override: true
image_upload:
  status: false
